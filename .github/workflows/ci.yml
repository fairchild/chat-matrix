# What a clean machine can check about this repo without an account anywhere.
#
# Nine stacks, three package managers, no root workspace — so every job names its
# own directory and installs there. Two rules shaped what's in here:
#
#   - Nothing may need a Cloudflare login, an account id, or a provider key. The
#     scripted model is what makes the comparison mean anything and it's built
#     in, so even the contract gates run for free. Anything that would need a
#     secret is listed at the bottom of this file rather than quietly dropped.
#   - A gate earns its place by failing for a real reason. `next build` catches
#     the leaked-NODE_ENV breakage this repo has already had once; `wrangler
#     types` + `tsc` catches a drifted binding; conformance and golden catch a
#     backend that stopped matching the reference; and the prose gates catch the
#     three non-code ways a green build still ships a broken page.
#
# Every command here was run against a fresh clone before being written down.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first one's answer uninteresting.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Every bun.lock here is lockfileVersion 1, which needs bun >= 1.3. Pinned
  # rather than floating, because `--frozen-lockfile` is the point of the job.
  BUN_VERSION: "1.3.11"
  # Both from the root .mise.toml. node is separate from bun on purpose: the
  # `next` bin is a `#!/usr/bin/env node` shebang and wrangler 4 declares
  # engines.node >= 22, so bun alone is not enough to run either.
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.13"
  NEXT_TELEMETRY_DISABLED: "1"
  COPILOTKIT_TELEMETRY_DISABLED: "true"
  # The control variable. Every stack already defaults to it, but `auto` plus a
  # stray provider key in the environment would move the model out from under
  # golden, which then refuses to run at all.
  DEMO_MODEL: scripted

jobs:
  # ---- static checks: no servers, no credentials --------------------------

  typecheck:
    name: typecheck · ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only shadcn, pi, pi-rpc and cloudflare-agents define a `typecheck`
          # script. The other cells get tsc directly rather than having a script
          # added to them purely to satisfy CI.
          - { name: cloudflare-agents, dir: backends/cloudflare-agents, cmd: "bun run types && bun run typecheck" }
          - { name: pi, dir: backends/pi, cmd: "bun run typecheck" }
          - { name: pi-rpc, dir: backends/pi-rpc, cmd: "bun run typecheck" }
          - { name: probes, dir: probes, cmd: "bunx tsc --noEmit" }
          - { name: shadcn, dir: frontends/shadcn, cmd: "bun run typecheck" }
          - { name: assistant-ui, dir: frontends/assistant-ui, cmd: "bunx tsc --noEmit" }
          - { name: ai-elements, dir: frontends/ai-elements, cmd: "bunx tsc --noEmit" }
          - { name: copilotkit, dir: frontends/copilotkit, cmd: "bunx tsc --noEmit" }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles(format('{0}/bun.lock', matrix.dir)) }}
          restore-keys: bun-${{ runner.os }}-
      - name: install
        working-directory: ${{ matrix.dir }}
        run: bun install --frozen-lockfile
      # cloudflare-agents is the one stack whose types don't exist in a fresh
      # checkout: worker-configuration.d.ts is generated and gitignored, and
      # tsconfig names it as a type root, so tsc fails with TS2688 until
      # `wrangler types` has run. That command reads wrangler.jsonc, needs no
      # login and no .dev.vars — verified against a clean clone.
      - name: ${{ matrix.name }}
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.cmd }}

  build:
    name: build · ${{ matrix.cell }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Three cells are `output: "export"`. CopilotKit's plain build is not:
          # its static export only happens under STATIC_EXPORT=1, which is a
          # publish-time shape, so here it is checked for .next/ instead.
          - { cell: assistant-ui, artifact: out/index.html }
          - { cell: copilotkit, artifact: .next/BUILD_ID }
          - { cell: ai-elements, artifact: out/index.html }
          - { cell: shadcn, artifact: out/index.html }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles(format('frontends/{0}/bun.lock', matrix.cell)) }}
          restore-keys: bun-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: frontends/${{ matrix.cell }}/.next/cache
          key: next-${{ matrix.cell }}-${{ hashFiles(format('frontends/{0}/bun.lock', matrix.cell)) }}
          restore-keys: next-${{ matrix.cell }}-
      - name: install
        working-directory: frontends/${{ matrix.cell }}
        run: bun install --frozen-lockfile
      # Each cell's build script sets NODE_ENV=production itself, because a
      # leaked NODE_ENV=development is what broke `next build` here before. This
      # job deliberately does not set it: if a build script loses that guard,
      # here is where it should surface.
      - name: build
        working-directory: frontends/${{ matrix.cell }}
        run: bun run build
      # A build that exits 0 without emitting is the failure mode a bare `next
      # build` cannot report.
      - name: it emitted something
        working-directory: frontends/${{ matrix.cell }}
        run: test -f "${{ matrix.artifact }}"

  python:
    name: python · ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: pydantic-ai, dir: backends/pydantic-ai }
          - { name: jinja, dir: frontends/jinja }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.dir }}/uv.lock
      # `--locked` rather than `--frozen`: it additionally asserts the lockfile
      # still matches pyproject.toml, so a hand-edited dependency can't pass.
      - name: install (locked)
        working-directory: ${{ matrix.dir }}
        run: uv sync --locked --python ${{ env.PYTHON_VERSION }}
      # Neither stack has a linter or a test suite, so importing the app is the
      # honest check: it resolves the environment and runs every module-level
      # statement, which is where a bad import or a broken template path lands.
      - name: import smoke
        working-directory: ${{ matrix.dir }}
        run: uv run python -c "import app.main"

  # ---- the contract, which needs a backend up but still no credentials ----

  contract:
    name: contract · ${{ matrix.backend }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The reference the golden fixtures were captured from, and the one
          # that actually gets published. The two pi backends are excluded:
          # both build a model runtime at module scope and exit non-zero
          # without a `pi` login, so they can be typechecked but not started.
          - { backend: pydantic-ai, port: 8001 }
          - { backend: cloudflare-agents, port: 8002 }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # No install step for protocol/: golden.ts imports only node: builtins and
      # runs straight off `bun protocol/golden.ts`. There is no package.json
      # there to install against.
      - name: start ${{ matrix.backend }}
        working-directory: backends/${{ matrix.backend }}
        run: |
          # Detached, with every stream redirected: a child that inherits the
          # runner's stdout keeps the step's pipe open and the step never ends.
          if [ -f pyproject.toml ]; then
            uv sync --locked --python "$PYTHON_VERSION"
            nohup uv run uvicorn app.main:app --port ${{ matrix.port }} --log-level warning \
              </dev/null >"$RUNNER_TEMP/backend.log" 2>&1 &
          else
            bun install --frozen-lockfile
            # scripts/setup.sh writes this from the example; wrangler reads
            # binding names out of it. The example carries no values.
            [ -f .dev.vars ] || cp .dev.vars.example .dev.vars
            PORT=${{ matrix.port }} nohup bun run dev \
              </dev/null >"$RUNNER_TEMP/backend.log" 2>&1 &
          fi
          for _ in $(seq 1 90); do
            if curl -sf -m 2 "http://localhost:${{ matrix.port }}/health" >/dev/null; then
              echo "healthy on :${{ matrix.port }}"
              exit 0
            fi
            sleep 1
          done
          echo "::error::${{ matrix.backend }} never became healthy on :${{ matrix.port }}"
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      # The contract every frontend is written against.
      #
      # The skip check is the point of the `tee`. conformance.sh ends with
      # `[ "$FAIL" -eq 0 ]`, and a skip is neither a pass nor a fail — so a run
      # printing "20 passed, 0 failed, 1 skipped" exits 0. That skip is correct
      # for a *published* backend, which declines to serve its bulk thread list,
      # and it is a regression for either backend here: both are started in
      # their local shape, where nothing should be withheld.
      - name: conformance
        run: |
          set -o pipefail
          ./protocol/conformance.sh "http://localhost:${{ matrix.port }}" \
            | tee "$RUNNER_TEMP/conformance.log"
          if grep -q "skipped" "$RUNNER_TEMP/conformance.log"; then
            echo "::error::${{ matrix.backend }} skipped an assertion while running locally — it is withholding a route it should serve"
            exit 1
          fi

      # Byte-for-byte against fixtures captured from the reference. The fixtures
      # are committed (protocol/golden/), so this needs no regeneration and no
      # network, and golden refuses to run against anything but the scripted
      # model — which is what makes it deterministic here.
      - name: golden
        run: bun protocol/golden.ts "http://localhost:${{ matrix.port }}"

      - name: backend log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/backend.log" || true

  # ---- the ways a green build still ships a broken page ------------------

  prose:
    name: prose and packaging gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # index/generate_notes.py exits 1 when any of the nine stacks has lost its
      # `## Ergonomics notes` heading. The notes are what the published site
      # renders and the README is their only copy, so losing one is a broken
      # page rather than a lint warning. Stack names come from scripts/stacks.sh
      # so adding a stack doesn't need an edit here.
      - name: every stack's notes still render
        run: |
          source scripts/stacks.sh
          args=()
          for e in "${BACKENDS[@]}"; do args+=(--backend "$(name_of "$e")"); done
          for e in "${FRONTENDS[@]}"; do args+=(--frontend "$(name_of "$e")"); done
          uv run --with markdown-it-py index/generate_notes.py --out "$RUNNER_TEMP/notes" "${args[@]}"

      # `build_index` substitutes this exact line to bake the hosted topology
      # in. Reworded, the hosted build asserts and every publish fails.
      - name: the hosted build's marker is intact
        run: grep -qF 'const HOSTED = null;' index/index.html

      # index/*.gif are symlinks into docs/recordings/. build_index dereferences
      # them into dist/; a dangling one means a published page with a dead image.
      - name: the hub's recordings resolve
        run: |
          fail=0
          for f in index/*.gif; do
            if [ -e "$f" ]; then echo "  ok   $f"; else echo "::error file=$f::dangling symlink"; fail=1; fi
          done
          exit $fail

      # The jinja cell's whole claim is that it runs the reference agent
      # unmodified — "verbatim copy", in its README and in the plan it was built
      # from. If these drift, the cell stops being a comparison and nothing else
      # would notice.
      - name: jinja still runs a verbatim copy of the reference agent
        run: |
          fail=0
          for f in agent scripted store models; do
            if diff -q "backends/pydantic-ai/app/$f.py" "frontends/jinja/app/$f.py" >/dev/null; then
              echo "  ok   $f.py"
            else
              echo "::error::frontends/jinja/app/$f.py has diverged from the reference copy"
              fail=1
            fi
          done
          exit $fail

      # `wrangler deploy` reads wrangler.jsonc and nothing else, so these two
      # values *are* the public surface. Flipped to "1" and published, the
      # deployment starts serving every visitor's thread titles and letting
      # anyone switch the model for everyone. The local matrix gets the open
      # shape from `bun run dev`'s --var flags, so the committed default costs
      # nothing by staying closed.
      - name: the committed worker config ships locked
        run: |
          config=backends/cloudflare-agents/wrangler.jsonc
          fail=0
          for var in PUBLIC_THREAD_LIST PUBLIC_MODEL_SWITCH; do
            if grep -qE "\"$var\"[[:space:]]*:[[:space:]]*\"0\"" "$config"; then
              echo "  ok   $var is \"0\""
            else
              echo "::error file=$config::$var must be \"0\" in the committed config — a deployed Worker reads this file and nothing else"
              fail=1
            fi
          done
          exit $fail

# ---------------------------------------------------------------------------
# Deliberately absent, so the absence is a decision rather than an oversight:
#
#   probes/            The Playwright suite is the best evidence in the repo and
#                      the most expensive: 30 tests needing five frontends, the
#                      hub and a backend all up, plus a chromium download. It
#                      belongs in a scheduled or dispatched run. The cheapest
#                      useful slice — `--grep jinja`, which needs only uv and
#                      chromium — is the obvious first thing to add next.
#   scripts/publish.sh Needs a Cloudflare account, and publishing is a decision
#                      someone makes rather than something a green build causes.
#   scripts/run.sh     Nine long-lived processes on fixed ports, which the
#                      contract jobs get at for one backend far more cheaply.
#   backends/pi*       Both construct a model runtime at module scope and exit
#                      non-zero without a `pi` login, so they typecheck here but
#                      their conformance and golden runs stay local.
#   golden --update    It overwrites the baseline it exists to defend.
#   golden.test.ts     Not hermetic: it captures live streams at import time.
#   lint / format      There is no linter in this repo; eslint was dropped from
#                      the shadcn cell deliberately and never added elsewhere.
